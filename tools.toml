# The programs the build runs, each in one version for every machine. python3 g20k.py tools fetch
# downloads the archives into external/tools/ and checks each against its SHA-256, the one the
# release page shows, and the programs of game20k's forks from the archive of [prebuilt].
# python3 g20k.py tools build-forks builds the forks from their sources instead. A path in
# local.toml ([tools]) takes the place of a folder here, its version is then checked, not fetched.

# YosysHQ's nightly build of Yosys with its slang frontend, openFPGALoader, Verilator and the
# Python that Apicula runs with (python). On Windows its programs find their DLLs through
