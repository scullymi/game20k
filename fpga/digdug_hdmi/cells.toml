# The cells of the synthesized netlist per board, written by g20k.py build --update-cells. The
# build compares its netlist with them: LUT, DFF, ALU may move by 5 percent, every other
# cell type must match.

[tangnano20k]
"$print" = 20
"$scopeinfo" = 4
"ALU" = 1010
"BUFG" = 1
"CLKDIV" = 1
"DFF" = 4522
"DPB" = 25
"DPX9B" = 17
"ELVDS_OBUF" = 4
"GND" = 1
"IBUF" = 6
"IOBUF" = 37
"LUT" = 11486
"MULT9X9" = 2
"OBUF" = 42
"OSER10" = 3
"RAM16SDP4" = 93
"SDPX9B" = 1
"SPX9" = 2
"VCC" = 1
"rPLL" = 2
