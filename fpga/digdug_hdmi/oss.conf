# Settings of the free toolchain build (scripts/build_fpga_oss.sh)
VHDL_TOPS=""
# tv80 has delays (#1) in its assignments
SLANG_OPTS="--ignore-timing"
# nextpnr follows reset paths through the asynchronous clear of flip-flops. With some placements
# it reports the core clock below its target, though the board runs. Seed 2 meets it in the model.
SEED=2
