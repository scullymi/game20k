# 1943 with HDMI. The platform comes from ../common, see ../common/platform.toml. This folder
# holds the game: jotego's core in ../vendor/jtcores (jtcores 548b87b), jt12 (YM2203 as jt03) in
# ../vendor/jt12 and jt49 in ../vendor/jt49, all GPL-3.0-or-later, the T80 BSD-style, each folder
# with a README.md. Changed files carry "game20k" in the text: jtframe_dual_ram (Gowin write
# mode, as for 1942), jt12_rst and jtgng_sound (reset on the rising edge), jt12_top (SSG level
# table), jt1943_main, _game, _video, _colmix (mirror taps, palette index, sound ROM from SDRAM).
# The RAM mirror g1943_mirror.sv is 1942's with a 1943 layout.

[core]
name = "g1943_hdmi"
platform = "../common"
# Core clock: 371.25 MHz / 10. jotego's clock enables make exactly 12, 6, 3 and 1.5 MHz
# from it (jtframe_gated_cen, 32/99), see src/game_core.sv
hz = 37_125_000

[sources]
files = [
  "src/jt1943_defs.v",
  "../vendor/jt12/hdl/jt12_rst.v",
  "../vendor/jtcores/modules/jtframe/hdl/ram/jtframe_ram.v",
