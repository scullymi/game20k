include = ["src/inc", "../vendor/jtcores/modules/jtframe/hdl/inc", "../vendor/jtcores/cores/1943/hdl", "../vendor/jt12/hdl"]

[vhdl]
tops = ["T80s"]
open_inputs = 0
files = [
  "../vendor/jtcores/modules/jtframe/hdl/cpu/t80/T80_ALU.vhd",
  "../vendor/jtcores/modules/jtframe/hdl/cpu/t80/T80_MCode.vhd",
  "../vendor/jtcores/modules/jtframe/hdl/cpu/t80/T80_Reg.vhd",
  "../vendor/jtcores/modules/jtframe/hdl/cpu/t80/T80.vhd",
  "../vendor/jtcores/modules/jtframe/hdl/cpu/t80/T80s.vhd",
]

[synth]
# slang reports an index out of range in a case branch that a constant never selects
slang_options = ["-Wno-error=index-oob", "-Wno-error=range-oob"]

[[generate]]
run = ["{root}/scripts/make_rom.py", "--package", "1943.manifest", "{out}/rom_map_pkg.sv"]
outputs = ["rom_map_pkg.sv"]
