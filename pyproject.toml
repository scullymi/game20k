# Settings of the checks of game20k's Python code (ruff, mypy). Only the build engine for now,
# the scripts under scripts/ follow when they move into it.

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["g20k.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the version check tells an old Python why it stops, before anything newer is imported
"g20k.py" = ["UP036"]

[tool.mypy]
python_version = "3.11"
files = ["g20k.py", "tools"]
strict = true
