# Sipeed Tang Nano 20K: the FPGA, its pins and the clock that comes in from outside.

[board]
name = "Tang Nano 20K"
device = "GW2AR-LV18QN88C8/I7"
family = "GW2A-18C"
synth_family = "gw2a"
loader = "tangnano20k"
pins = "board.cst"
# the 18 Kbit block RAMs of the device
block_rams = 46
# the Companion's SPI shares the configuration pins of both SPI ports
sspi_as_gpio = true
mspi_as_gpio = true

[flash]
# 64 Mbit, one core per MB, see project.toml for the order
size = 0x800000
slot_size = 0x100000

[[clock]]
name = "sys_clk"
port = "sys_clk"
hz = 27_000_000
