#
# Categories of the release notes that GitHub generates from merged pull requests
# ("Generate release notes" in a draft release), sorted by the labels of the pull requests.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: New Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
