#
# Builds the firmware image for the Pico 2 W with its NOTICE, through
# g20k.py firmware --release, on a clean Linux machine from the sources in this repository.
#
# Called by release.yml on a pushed tag v<version>: the release build, its zip kept as an artifact
# of the run for the draft release, plus a build provenance attestation.
# By hand (Actions tab, "Run workflow", or gh workflow run pico2w-firmware.yml): a trial build of
# the chosen branch, the zip kept as an artifact of the run, no release.
name: Pico 2 W firmware

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # full history and tags for git describe, and the submodules with their own submodules
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # the prebuilt picotool of Linux links the system's libusb
      - name: libusb
        run: sudo apt-get update -q && sudo apt-get install -y -q libusb-1.0-0

      - name: Tool archives from the cache
        uses: actions/cache@v6
        with:
          path: external/tools/downloads
          key: tool-archives-firmware-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      - name: Archives (g20k.py tools fetch)
        run: python3 g20k.py tools fetch arm armlibs pioasm picotool cmake ninja

      # a tag builds a release, anything else a trial build (--dev: no tag needed)
      - name: Build and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 g20k.py firmware --release
          else
            python3 g20k.py firmware --release --dev
          fi

      # the zip as it is, not zipped again: the artifact takes its name,
      # game20k-<version>-pico2w.zip
      - name: Keep the zip of this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/*.uf2
