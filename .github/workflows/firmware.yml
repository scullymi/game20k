#
# Builds the firmware of the Pico 2 W and that of the BL616 (Tang Nano 20K alone, M0S Dock), each
# with its NOTICE, through g20k.py firmware --release pico2w|bl616, on a clean Linux machine from
# the sources in this repository.
#
# Called by release.yml on a pushed tag v<version>: the release builds, their zips kept as
# artifacts of the run for the draft release, plus a build provenance attestation.
# By hand (Actions tab, "Run workflow", or gh workflow run firmware.yml): trial builds of the
# chosen branch, the zips kept as artifacts of the run, no release.
name: Firmware

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  firmware:
    strategy:
      matrix:
        include:
          - target: pico2w
            tools: arm armlibs pioasm picotool cmake ninja
          - target: bl616
            tools: riscv riscvlibs bouffalo_sdk cmake ninja
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # full history and tags for git describe, and the submodules with their own submodules
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # the prebuilt picotool of Linux links the system's libusb
      - name: libusb
        if: matrix.target == 'pico2w'
        run: sudo apt-get update -q && sudo apt-get install -y -q libusb-1.0-0

      - name: Tool archives from the cache
        uses: actions/cache@v6
        with:
          path: external/tools/downloads
          key: tool-archives-firmware-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      - name: Archives (g20k.py tools fetch)
        run: python3 g20k.py tools fetch ${{ matrix.tools }}

      # a tag builds a release, anything else a trial build (--dev: no tag needed)
      - name: Build and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 g20k.py firmware --release ${{ matrix.target }}
          else
            python3 g20k.py firmware --release ${{ matrix.target }} --dev
          fi

      # the zip as it is, not zipped again: the artifact takes its name,
      # game20k-<version>-firmware-<target>.zip
      - name: Keep the zip of this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/*.uf2
            dist/*/*.bin
