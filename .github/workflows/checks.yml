#
# Checks on every push and pull request, two jobs:
#   checks    scripts/checks.sh --ci on this repository and on the fork's gitlink, the
#             contract of scripts/check_contracts.py, and the host tests in tests/host, which
#             generate the game table from the manifests with scripts/make_fw_tables.py
#   firmware  the release build of scripts/make_firmware_release.sh (DEV=1), then no compiler
#             warning in the fork's own RetroAchievements files src/ra_*.c
# The fork is checked through its gitlink, it has no workflow of its own. No schedule on
# purpose: every run comes from a push.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # full history: checks.sh --ci compares the line ends with the commit before the push
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Scans (scripts/checks.sh --ci, game20k and fork)
        run: |
          sh scripts/checks.sh --ci --base "$BASE"
          sh scripts/checks.sh --ci --fork --base "$BASE"
        env:
          # the commit before the push, or the target of a pull request. A new branch has
          # none (all zeros), checks.sh then compares with the parent of HEAD
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Contracts (scripts/check_contracts.py)
        run: python3 scripts/check_contracts.py

      # ASan needs fewer random mmap bits than the runner kernel's default
      - name: Host tests (make -C tests/host)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          test -f tests/host/Makefile || { echo '::error::tests/host/Makefile missing'; exit 1; }
          make -C tests/host

  firmware:
    runs-on: ubuntu-24.04
    env:
      # the same toolchain and checksum as .github/workflows/pico2w-firmware.yml, keep both in step
      TOOLCHAIN: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
      TOOLCHAIN_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
    steps:
      # full history and tags for git describe. A full clone of the fork also gives
      # origin/game20k, which build_companion.sh checks
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Arm GNU Toolchain 14.2.rel1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$TOOLCHAIN.tar.xz" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$TOOLCHAIN.tar.xz"
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/$TOOLCHAIN.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$TOOLCHAIN.tar.xz" -C "$RUNNER_TEMP"
          echo "PICO_TOOLCHAIN_PATH=$RUNNER_TEMP/$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build (DEV=1 scripts/make_firmware_release.sh)
        run: DEV=1 scripts/make_firmware_release.sh

      # the full build's log: ra_patch.c must show up in it, else no warning proves nothing
      - name: No warning in the fork's src/ra_*.c
        run: |
          log=external/FPGA-Companion/src/rp2040/build_pico2_native/make.log
          n=$(grep -c 'ra_patch\.c' "$log" || true)
          echo "ra_patch.c appears in ${n:-0} lines of $log"
          [ "${n:-0}" -gt 0 ] || { echo "::error::ra_patch.c was not built, $log proves nothing"; exit 1; }
          if grep -E 'src/ra_[a-z_]+\.c:[0-9]+:[0-9]+: warning' "$log"; then
            echo "::error::compiler warnings in the fork's src/ra_*.c, see above"; exit 1
          fi
