#
# Checks on every push and pull request, four jobs:
#   checks          g20k.py check --ci on this repository and on the fork's gitlink, which
#                   also runs the host tests in tests/host, the contract of
#                   scripts/check_contracts.py, and the tests, ruff and mypy of the build engine
#   engine-windows  the tests of the build engine on Windows, where paths, line ends and the
#                   shell of Yosys' exec differ
#   firmware        the release build of g20k.py firmware (--dev) on Linux and Windows, a warning
#                   in src/game20k stops it, on Linux also the build without RetroAchievements
#                   and the boards PICO and PICO2 of FPGA Companion without game20k's code,
#                   and the BL616 release (--dev) for the Tang Nano 20K alone and the M0S Dock
#   firmware-same   the files of both releases are the same bytes on Linux and Windows
# The simulations run in sims.yml, only when fpga/ changes.
# The fork is checked through its gitlink, it has no workflow of its own. No schedule on
# purpose: every run comes from a push.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # a pull request from a branch of this repository has run already as its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # full history: g20k.py check --ci compares the line ends with the commit before the push
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # ASan in the host tests needs fewer random mmap bits than the runner kernel's default
      - name: mmap bits for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Scans and host tests (g20k.py check --ci, game20k and fork)
        run: |
          python3 g20k.py check --ci --base "$BASE"
          python3 g20k.py check --ci --fork --base "$BASE"
        env:
          # the commit before the push, or the target of a pull request. A new branch has
          # none (all zeros), the check then compares with the parent of HEAD
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Contracts (scripts/check_contracts.py)
        run: python3 scripts/check_contracts.py

      - name: Build engine tests (tools/engine/tests)
        run: python3 -m unittest discover -s tools/engine/tests -t .

      # ruff, mypy and clang-format in the versions of the dev group of pyproject.toml
      - name: Build engine ruff and mypy, clang-format of the fork's own code
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"]))' \
            > "$RUNNER_TEMP/dev.txt"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r "$RUNNER_TEMP/dev.txt"
          "$RUNNER_TEMP/venv/bin/ruff" check
          "$RUNNER_TEMP/venv/bin/ruff" format --check
          "$RUNNER_TEMP/venv/bin/mypy"
          "$RUNNER_TEMP/venv/bin/clang-format" --dry-run -Werror external/FPGA-Companion/src/game20k/*.[ch]

  engine-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # the checkout of Git for Windows, with CRLF line ends, as a user gets it
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build engine tests (tools/engine/tests)
        run: python -m unittest discover -s tools/engine/tests -t .

  firmware:
    # a pull request from a branch of this repository has run already as its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # full history and tags for git describe
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # the prebuilt picotool of Linux links the system's libusb
      - name: libusb
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libusb-1.0-0

      - name: Tool archives from the cache
        uses: actions/cache@v6
        with:
          path: external/tools/downloads
          key: tool-archives-firmware-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      - name: Archives (g20k.py tools fetch)
        run: ${{ matrix.python }} g20k.py tools fetch arm armlibs pioasm picotool riscv riscvlibs bouffalo_sdk cmake ninja

      - name: Build (g20k.py firmware --release --dev)
        run: ${{ matrix.python }} g20k.py firmware --release --dev

      - name: Build (g20k.py firmware --release bl616 --dev)
        run: ${{ matrix.python }} g20k.py firmware --release bl616 --dev

      - name: Keep the files of both releases
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ runner.os }}
          path: dist/*/*
          if-no-files-found: error

      # the switch stays usable: the build without RetroAchievements, and no part of them in it
      - name: Build (g20k.py firmware --without-ra)
        if: runner.os == 'Linux'
        run: |
          ${{ matrix.python }} g20k.py firmware --without-ra
          map=build/firmware/pico2-native-no-ra/fpga_companion.elf.map
          test -s "$map"
          if grep -E 'ra_(task|patch|net)\.c\.o' "$map"; then exit 1; fi

      # the fork keeps the boards of FPGA Companion: they build without game20k's code
      - name: Build (g20k.py firmware --upstream PICO, PICO2)
        if: runner.os == 'Linux'
        run: |
          for board in PICO PICO2; do
            ${{ matrix.python }} g20k.py firmware --upstream $board
            map=build/firmware/upstream-${board,,}/fpga_companion.elf.map
            test -s "$map"
            if grep -E 'src/(game20k|rcheevos)/[^ ]*\.c\.o|/firmware/gen/[^ ]*\.c\.o' "$map"; then exit 1; fi
          done

  firmware-same:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
      - name: Linux and Windows give the same bytes
        run: diff -r firmware-Linux firmware-Windows
