#
# Checks on every push and pull request, four jobs:
#   checks          scripts/checks.sh --ci on this repository and on the fork's gitlink, which
#                   also runs the host tests in tests/host, the contract of
#                   scripts/check_contracts.py, and the tests, ruff and mypy of the build engine
#   engine-windows  the tests of the build engine on Windows, where paths, line ends and the
#                   shell of Yosys' exec differ
#   firmware        the release build of g20k.py firmware (--dev) on Linux and Windows, then no
#                   compiler warning in the fork's own files src/game20k/*.c
#   firmware-same   the image and the NOTICE of both are the same bytes
# The simulations run in sims.yml, only when fpga/ changes.
# The fork is checked through its gitlink, it has no workflow of its own. No schedule on
# purpose: every run comes from a push.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # a pull request from a branch of this repository has run already as its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # full history: checks.sh --ci compares the line ends with the commit before the push
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # ASan in the host tests needs fewer random mmap bits than the runner kernel's default
      - name: mmap bits for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Scans and host tests (scripts/checks.sh --ci, game20k and fork)
        run: |
          sh scripts/checks.sh --ci --base "$BASE"
          sh scripts/checks.sh --ci --fork --base "$BASE"
        env:
          # the commit before the push, or the target of a pull request. A new branch has
          # none (all zeros), checks.sh then compares with the parent of HEAD
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Contracts (scripts/check_contracts.py)
        run: python3 scripts/check_contracts.py

      - name: Build engine tests (tools/engine/tests)
        run: python3 -m unittest discover -s tools/engine/tests -t .

      # ruff and mypy in the versions of the dev group of pyproject.toml
      - name: Build engine ruff and mypy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"]))' \
            > "$RUNNER_TEMP/dev.txt"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r "$RUNNER_TEMP/dev.txt"
          "$RUNNER_TEMP/venv/bin/ruff" check
          "$RUNNER_TEMP/venv/bin/ruff" format --check
          "$RUNNER_TEMP/venv/bin/mypy"

  engine-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # the checkout of Git for Windows, with CRLF line ends, as a user gets it
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build engine tests (tools/engine/tests)
        run: python -m unittest discover -s tools/engine/tests -t .

  firmware:
    # a pull request from a branch of this repository has run already as its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # full history and tags for git describe
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # the prebuilt picotool of Linux links the system's libusb
      - name: libusb
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libusb-1.0-0

      - name: Tool archives from the cache
        uses: actions/cache@v6
        with:
          path: external/tools/downloads
          key: tool-archives-firmware-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      - name: Archives (g20k.py tools fetch)
        run: ${{ matrix.python }} g20k.py tools fetch arm armlibs pioasm picotool cmake ninja

      - name: Build (g20k.py firmware --release --dev)
        run: ${{ matrix.python }} g20k.py firmware --release --dev

      # the full build's log: ra_patch.c must show up in it, else no warning proves nothing
      - name: No warning in the fork's src/game20k/*.c
        if: runner.os == 'Linux'
        run: |
          log=build/firmware/pico2-native/ninja.log
          n=$(grep -c 'ra_patch\.c' "$log" || true)
          echo "ra_patch.c appears in ${n:-0} lines of $log"
          [ "${n:-0}" -gt 0 ] || { echo "::error::ra_patch.c was not built, $log proves nothing"; exit 1; }
          if grep -E 'src/game20k/[a-z0-9_]+\.[ch]:[0-9]+:[0-9]+: warning' "$log"; then
            echo "::error::compiler warnings in the fork's src/game20k/*.c, see above"; exit 1
          fi

      - name: Keep the image and its NOTICE
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ runner.os }}
          path: |
            dist/*/*.uf2
            dist/*/NOTICE.txt
          if-no-files-found: error

  firmware-same:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
      - name: Linux and Windows give the same bytes
        run: diff -r firmware-Linux firmware-Windows
