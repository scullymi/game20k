#
# Builds the programs of game20k's forks (Apicula, nextpnr and Yosys, from the commits of tools.toml)
# with static linking, one archive per kind of machine, each with a build provenance
# attestation, and puts them on a prerelease tools-<key>. The key (toolchain.forks_key) names
# what the archives are made of: the commits of the forks, the version of the suite and the text
# of tools/engine/forks.py. Started by hand (Actions tab, "Run workflow", or gh workflow run
# tools.yml) after one of them changes. The summary of the run gives the [prebuilt] table for
# tools.toml, which python3 g20k.py tools fetch then takes. A release of this key
# that exists already stops the run before the builds: an archive on it does not change once
# tools.toml names it.
name: Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the key, and a stop when its release is there already
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Release of these commits
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(python3 -c 'from pathlib import Path; from tools.engine import config, toolchain
          print(toolchain.forks_key(config.load_toolset(Path("tools.toml"))))')
          if gh release view "tools-$key" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "tools-$key is there already"; exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

  pack:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04    # linux-x64, fully static
            python: python3
          - os: macos-15        # darwin-arm64, Boost static, runs on macOS 15 and later
            python: python3
          - os: windows-2025    # windows-x64, Boost and the C++ runtime static
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # what building nextpnr needs, Boost with its static libraries and those of the
      # compression libraries static Boost iostreams names, and Flex and Bison for Yosys
      - name: Build dependencies (apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison libboost-program-options-dev \
            libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev \
            libbz2-dev liblzma-dev zlib1g-dev libzstd-dev

      # LIBRARY_PATH: the linker finds the libraries static Boost names in Homebrew's folder
      - name: Build dependencies (Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja boost flex bison
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # MSVC's environment (cl, cmake, ninja, dumpbin) for the steps after this one, and Boost
      # built static by vcpkg, which cmake finds through CMAKE_PREFIX_PATH: vcpkg's toolchain
      # file takes its triplet only from the cmake command line. nextpnr calls none of the
      # compression libraries of Boost iostreams. Flex and Bison for Yosys as its own CI gets them
      - name: Build dependencies (MSVC, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
          choco install winflexbison3 --no-progress
          "C:\ProgramData\chocolatey\lib\winflexbison3\tools" >> $env:GITHUB_PATH
          vcpkg install --triplet x64-windows-static boost-program-options "boost-iostreams[core]" boost-thread boost-filesystem
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      # the suite's Python makes nextpnr's chip database
      - name: Archives (g20k.py tools fetch)
        run: ${{ matrix.python }} g20k.py tools fetch suite ghdl

      - name: Forks (g20k.py tools pack)
        run: ${{ matrix.python }} g20k.py tools pack --out dist

      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      # the archive as it is, not zipped again: the artifact takes its name
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error

  # the only job that creates the release, once every archive exists
  release:
    needs: [check, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: game20k-forks-*
          merge-multiple: true
          path: dist

      # game20k-forks-<key>-<machine>.tar.gz: the key of the check job for all, else a job built
      # from another state
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.check.outputs.key }}
        run: |
          ls -l dist
          keys=$(ls dist | sed -E 's/^game20k-forks-([0-9a-f]{12})-.*/\1/' | sort -u)
          [ "$keys" = "$KEY" ] || { echo "the archives name $keys, the check job has $KEY"; exit 1; }
          TAG="tools-$KEY"
          # what the key names: the sources of tools.toml, the suite and the recipe
          python3 -c 'import tomllib; t = tomllib.load(open("tools.toml", "rb"))
          for n, s in t["source"].items(): print("-", n, s["repo"], s["commit"])
          print("- suite", t["download"]["suite"]["version"])' > notes.md
          echo "- recipe tools/engine/forks.py at $GITHUB_SHA" >> notes.md
          gh release create "$TAG" dist/*.tar.gz --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "game20k forks $KEY" --notes-file notes.md
          {
            echo '## [prebuilt] for tools.toml'
            echo '```toml'
            echo '[prebuilt]'
            echo "release = \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG\""
            for f in dist/*.tar.gz; do
              n=$(basename "$f")
              m=${n#game20k-forks-$KEY-}
              echo
              echo "[prebuilt.${m%.tar.gz}]"
              echo "url = \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$n\""
              echo "sha256 = \"$(sha256sum "$f" | cut -d' ' -f1)\""
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
