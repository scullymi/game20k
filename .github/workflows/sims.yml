#
# The simulations that need no ROM: rom_sdram, the screen layouts, the audio handover and what
# the upstream Companion firmware needs (ROM loader, READ_CFG) in fpga/common/sim, the Pac-Man
# RAM mirror in fpga/pacman_hdmi/sim. They take about half an hour on a runner, so they run
# only when the FPGA sources, the menu script or this workflow change. Verilator comes
# from the oss-cad-suite the free build uses (scripts/oss/fetch_suite.sh), its archive from the
# cache of bitstreams.yml or its own.
name: Simulations

on:
  push:
    paths:
      - 'fpga/**'
      - 'scripts/make_menu.py'
      - 'scripts/oss/fetch_suite.sh'
      - '.github/workflows/sims.yml'
  pull_request:
    paths:
      - 'fpga/**'
      - 'scripts/make_menu.py'
      - 'scripts/oss/fetch_suite.sh'
      - '.github/workflows/sims.yml'

permissions:
  contents: read

jobs:
  sims:
    runs-on: ubuntu-24.04
    env:
      # Ubuntu 24.04 has no nvc package, the release package of nvc instead
      NVC_DEB: nvc_1.23.0-1_amd64_ubuntu-24.04.deb
      NVC_SHA256: 33d65eafb83d83352716895e44c116002f94d8a198a9486a3cee6df3e4fdfb89
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: oss-cad-suite archive from the cache
        uses: actions/cache@v6
        with:
          path: external/oss-downloads
          key: oss-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/oss/fetch_suite.sh') }}

      # Verilator of the suite: the one of Ubuntu 24.04 (5.020) aborted at random on exit
      # ("attempted to destroy locked Thread Pool")
      - name: Verilator (oss-cad-suite) and nvc 1.23.0
        run: |
          SUITE_DOWNLOADS=external/oss-downloads scripts/oss/fetch_suite.sh main
          echo "$PWD/external/oss-cad-suite/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/$NVC_DEB" "https://github.com/nickg/nvc/releases/download/r1.23.0/$NVC_DEB"
          echo "$NVC_SHA256  $RUNNER_TEMP/$NVC_DEB" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/$NVC_DEB"
          external/oss-cad-suite/bin/verilator --version
          nvc --version

      - name: Simulations without ROMs
        run: |
          sh fpga/common/sim/run_sim.sh
          sh fpga/common/sim/run_screen_sim.sh
          sh fpga/common/sim/run_audio_sim.sh
          sh fpga/common/sim/run_mcu_sim.sh
          sh fpga/pacman_hdmi/sim/run_sim.sh
