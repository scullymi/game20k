#
# The simulations that need no ROM: rom_sdram, the screen layouts, the audio handover and what
# the upstream Companion firmware needs (ROM loader, READ_CFG) in fpga/common/sim, the Pac-Man
# RAM mirror in fpga/pacman_hdmi/sim. They run only when the FPGA sources, the scripts, the
# build engine, project.toml, tools.toml or this workflow change. Verilator comes from the oss-cad-suite of tools.toml
# (python3 g20k.py tools fetch), its archive from the cache.
name: Simulations

on:
  push:
    paths:
      - 'fpga/**'
      - 'scripts/**'
      - 'tools/**'
      - 'g20k.py'
      - 'project.toml'
      - 'tools.toml'
      - '.github/workflows/sims.yml'
  pull_request:
    paths:
      - 'fpga/**'
      - 'scripts/**'
      - 'tools/**'
      - 'g20k.py'
      - 'project.toml'
      - 'tools.toml'
      - '.github/workflows/sims.yml'

permissions:
  contents: read

jobs:
  sims:
    # a pull request from a branch of this repository has run already as its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Ubuntu 24.04 has no nvc package, the release package of nvc instead
      NVC_DEB: nvc_1.23.0-1_amd64_ubuntu-24.04.deb
      NVC_SHA256: 33d65eafb83d83352716895e44c116002f94d8a198a9486a3cee6df3e4fdfb89
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tool archives from the cache
        uses: actions/cache@v6
        with:
          path: external/tools/downloads
          key: tool-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      # Verilator of the suite: the one of Ubuntu 24.04 (5.020) aborted at random on exit
      # ("attempted to destroy locked Thread Pool")
      - name: Verilator (oss-cad-suite) and nvc 1.23.0
        run: |
          python3 g20k.py tools fetch
          suite=$(python3 g20k.py tools path suite)
          echo "$suite/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/$NVC_DEB" "https://github.com/nickg/nvc/releases/download/r1.23.0/$NVC_DEB"
          echo "$NVC_SHA256  $RUNNER_TEMP/$NVC_DEB" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/$NVC_DEB"
          "$suite/bin/verilator" --version
          nvc --version

      - name: Simulations without ROMs
        run: |
          sh fpga/common/sim/run_sim.sh
          sh fpga/common/sim/run_screen_sim.sh
          sh fpga/common/sim/run_audio_sim.sh
          sh fpga/common/sim/run_mcu_sim.sh
          sh fpga/pacman_hdmi/sim/run_sim.sh
