#
# Weekly look at the upstream repositories of the HDL copied into fpga/. The run fails when one
# of the copied files changed upstream after the commit marked as reviewed in
# scripts/deps_status.py, and GitHub sends a mail about the failed run. The report is in the
# summary of the run. Read-only, the token only lifts the API limit.
name: Upstream

on:
  schedule:
    - cron: '0 6 * * 6'   # Saturday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendored:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copied HDL against upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deps_status.py --vendored --ci
