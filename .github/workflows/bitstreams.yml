#
# Builds the bitstreams of every core with the free toolchain and packs the flash image with its
# NOTICE, through python3 g20k.py release, on a clean Linux machine from the sources in this
# repository.
#
# On a push that changes the FPGA sources or the build: a trial build, the zip kept as an
# artifact of the run. Called by release.yml on a pushed tag v<version>: the release build, its
# zip kept for the draft release, plus a build provenance attestation. By hand (Actions tab, "Run
# workflow", or gh workflow run bitstreams.yml): a trial build of the chosen branch.
# The tools are cached, keyed by tools.toml: the archives g20k.py tools fetch downloads and the
# programs of the forks g20k.py tools build makes.
name: Bitstreams

on:
  push:
    branches: ['**']
    paths:
      - 'fpga/**'
      - 'boards/**'
      - 'tools/**'
      - 'scripts/oss/**'
      - 'scripts/bitstream_notice.py'
      - 'scripts/make_menu.py'
      - 'scripts/make_rom.py'
      - 'g20k.py'
      - 'project.toml'
      - 'tools.toml'
      - '.github/workflows/bitstreams.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  bitstreams:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # full history and tags for git describe, which names the version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # what g20k.py tools build --source needs to build nextpnr
      - name: Build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-program-options-dev \
            libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev

      - name: Tools from the cache
        id: tools
        uses: actions/cache/restore@v6
        with:
          path: |
            external/tools/downloads
            external/tools/apicula-*
            external/tools/nextpnr-*
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml', 'tools/engine/toolchain.py') }}

      - name: Archives (g20k.py tools fetch)
        run: python3 g20k.py tools fetch

      - name: Forks (g20k.py tools build --source)
        run: python3 g20k.py tools build --source

      # saved here, before the build: a failed build keeps the tools for the next run
      - name: Tools into the cache
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            external/tools/downloads
            external/tools/apicula-*
            external/tools/nextpnr-*
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # a tag builds a release, anything else a trial build (--dev: no tag needed)
      - name: Build and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 g20k.py release
          else
            python3 g20k.py release --dev
          fi

      # per core the SHA-256 of its .bin and its clocks, also after a failed build, to compare
      # with a build elsewhere
      - name: Bitstreams and clocks
        if: always()
        run: |
          {
            echo '## Bitstreams and clocks'
            echo '```'
            for c in $(python3 g20k.py cores); do
              n=$(basename "$c")
              sha256sum "build/$n/$n.bin" 2>/dev/null || echo "no $n.bin"
              cat "build/$n/fmax.txt" 2>/dev/null || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # the logs and bitstreams of every core, also after a failed build
      - name: Keep the build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oss-build-${{ github.run_id }}
          path: |
            build/release-logs/*.log
            build/*/*.log
            build/*/*.fs
            build/*/*.bin
            build/*/report.json
            build/*/fmax.txt
            build/*/stat.json
            build/*/tools.txt
          if-no-files-found: warn

      # the zip as it is, not zipped again: the artifact takes its name,
      # game20k-<version>-tangnano20k.zip
      - name: Keep the zip of this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/*.bin
