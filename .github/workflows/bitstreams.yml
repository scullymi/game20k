#
# Builds the bitstreams of every core with the free toolchain and packs the flash image with its
# NOTICE, through OSS=1 scripts/make_bitstream_release.sh, on a clean Linux machine from the
# sources in this repository.
#
# On a push that changes the FPGA sources or the free build: a trial build, the zip kept as an
# artifact of the run. Called by release.yml on a pushed tag v<version>: the release build, its
# zip kept for the draft release, plus a build provenance attestation. By hand (Actions tab, "Run workflow", or
# gh workflow run bitstreams.yml): a trial build of the chosen branch.
# The tools are cached: the archives of the oss-cad-suite (scripts/oss/fetch_suite.sh) and the
# forks built by scripts/oss/build_tools.sh, keyed by both scripts.
name: Bitstreams

on:
  push:
    branches: ['**']
    paths:
      - 'fpga/**'
      - 'scripts/build_fpga_oss.sh'
      - 'scripts/oss/**'
      - 'scripts/make_bitstream_release.sh'
      - 'scripts/bitstream_notice.py'
      - 'scripts/make_menu.py'
      - 'scripts/make_rom.py'
      - '.github/workflows/bitstreams.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  bitstreams:
    runs-on: ubuntu-24.04
    steps:
      # full history and tags for git describe, which names the version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # build_tools.sh compiles nextpnr and sv-elab, build_fpga_oss.sh runs build.tcl in tclsh
      - name: Build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-program-options-dev \
            libboost-iostreams-dev libboost-thread-dev libeigen3-dev tcl

      - name: Tools from the cache
        id: tools
        uses: actions/cache/restore@v6
        with:
          path: |
            external/oss-downloads
            external/oss-tools
          key: oss-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/oss/fetch_suite.sh', 'scripts/oss/build_tools.sh') }}

      - name: oss-cad-suite (scripts/oss/fetch_suite.sh)
        run: SUITE_DOWNLOADS=external/oss-downloads scripts/oss/fetch_suite.sh

      - name: nextpnr, Apicula, sv-elab (scripts/oss/build_tools.sh)
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/oss/build_tools.sh

      # saved here, before the build: a failed build keeps the tools for the next run
      - name: Tools into the cache
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            external/oss-downloads
            external/oss-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # a tag builds a release, anything else a trial build (DEV=1: no tag needed)
      - name: Build and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            OSS=1 scripts/make_bitstream_release.sh
          else
            OSS=1 DEV=1 scripts/make_bitstream_release.sh
          fi

      # per core the SHA-256 of its .bin and its clocks, also after a failed build, to compare
      # with a build elsewhere
      - name: Bitstreams and clocks
        if: always()
        run: |
          for c in $(awk '!/^#/ && NF == 2 { print $1 }' fpga/common/slots.txt); do
            echo "== $c"
            sha256sum "fpga/$c/impl/oss/$c.bin" 2>/dev/null || echo "no $c.bin"
            python3 scripts/oss/check_fmax.py "fpga/$c/impl/oss/report.json" 2>/dev/null || true
          done

      # the logs and bitstreams of every core, also after a failed build
      - name: Keep the build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oss-build-${{ github.run_id }}
          path: |
            fpga/*/impl/oss/*.log
            fpga/*/impl/oss/*.fs
            fpga/*/impl/oss/*.bin
            fpga/*/impl/oss/report.json
            fpga/*/impl/oss/tools.txt
          if-no-files-found: warn

      # the zip as it is, not zipped again: the artifact takes its name,
      # game20k-<version>-tangnano20k.zip
      - name: Keep the zip of this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/*.bin
