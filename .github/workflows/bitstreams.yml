#
# Builds the bitstreams of every core with the free toolchain and packs the flash image with its
# NOTICE, through python3 g20k.py release, on a clean Linux machine from the sources in this
# repository. One job per board: the Nano with a Pico 2 W or an M0S Dock on its header, and the
# Nano alone with the Companion on its own BL616. The programs of the forks come from the archive of [prebuilt] in tools.toml.
#
# On a push that changes the FPGA sources or the build: a trial build, the zip kept as an
# artifact of the run. Called by release.yml on a pushed tag v<version>: the release build, its
# zip kept for the draft release, plus a build provenance attestation. By hand (Actions tab, "Run
# workflow", or gh workflow run bitstreams.yml): a trial build of the chosen branch.
# The tool archives are cached, keyed by tools.toml: the downloads of g20k.py tools fetch and the
# archive of the forks (made by tools.yml) that g20k.py tools build --prebuilt fetches.
name: Bitstreams

on:
  push:
    branches: ['**']
    paths:
      - 'fpga/**'
      - 'boards/**'
      - 'tools/**'
      - 'scripts/**'
      - 'g20k.py'
      - 'project.toml'
      - 'tools.toml'
      - '.github/workflows/bitstreams.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  bitstreams:
    strategy:
      fail-fast: false
      matrix:
        board: [tangnano20k, tangnano20k-singleboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # the board of project.toml builds into build/<core>, another into build/<board>/<core>
      BUILDS: ${{ matrix.board == 'tangnano20k' && 'build' || format('build/{0}', matrix.board) }}
    steps:
      # full history and tags for git describe, which names the version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # its own key: the cache of sims.yml has no archive of the forks
      - name: Tool archives from the cache
        id: tools
        uses: actions/cache/restore@v6
        with:
          path: external/tools/downloads
          key: tool-archives-forks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}

      - name: Archives (g20k.py tools fetch)
        run: python3 g20k.py tools fetch suite ghdl

      - name: Forks (g20k.py tools build --prebuilt)
        run: python3 g20k.py tools build --prebuilt

      # saved here, before the build: a failed build keeps the archives for the next run
      - name: Tool archives into the cache
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: external/tools/downloads
          key: ${{ steps.tools.outputs.cache-primary-key }}

      # a tag builds a release, anything else a trial build (--dev: no tag needed)
      - name: Build and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 g20k.py release --board boards/${{ matrix.board }}
          else
            python3 g20k.py release --board boards/${{ matrix.board }} --dev
          fi

      # per core the SHA-256 of its .bin and its clocks, also after a failed build, to compare
      # with a build elsewhere
      - name: Bitstreams and clocks
        if: always()
        run: |
          {
            echo "## Bitstreams and clocks, ${{ matrix.board }}"
            echo '```'
            for c in $(python3 g20k.py cores); do
              n=$(basename "$c")
              sha256sum "$BUILDS/$n/$n.bin" 2>/dev/null || echo "no $n.bin"
              cat "$BUILDS/$n/fmax.txt" 2>/dev/null || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # the logs and bitstreams of every core, also after a failed build
      - name: Keep the build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oss-build-${{ github.run_id }}-${{ matrix.board }}
          path: |
            ${{ env.BUILDS }}/release-logs/*.log
            ${{ env.BUILDS }}/*/*.log
            ${{ env.BUILDS }}/*/*.fs
            ${{ env.BUILDS }}/*/*.bin
            ${{ env.BUILDS }}/*/report.json
            ${{ env.BUILDS }}/*/fmax.txt
            ${{ env.BUILDS }}/*/stat.json
            ${{ env.BUILDS }}/*/tools.txt
          if-no-files-found: warn

      # the zip as it is, not zipped again: the artifact takes its name,
      # game20k-<version>-cores-<board>.zip
      - name: Keep the zip of this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/*.bin
